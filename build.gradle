plugins {
    id 'java-library'
}

group = 'org.peergos'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api 'tech.kwik:kwik'
    implementation 'tech.kwik:agent15'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'interop.probe.dir', file('../interop-probe/target/release').absolutePath
    systemProperty 'mainline.live', System.getProperty('mainline.live', 'false')
    systemProperty 'interop.linger', System.getProperty('interop.linger', 'false')
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.register('printTestClasspath') {
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}
